name: 🎮 Run Autonomous Minecraft Companion Bot

# এখন থেকে কোড সেভ করলেই অটো চালু হবে, আবার চাইলে ম্যানুয়ালিও রান করতে পারবেন
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-companion-bot:
    name: 🚀 Launching Bot in Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Repository Code Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Bot Dependencies
        run: |
          npm install

      - name: 🤖 Start Minecraft Companion Bot
        run: |
          echo "🚀 Bot is connecting to server from config.json..."
          node index.js
